[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-multilevel-feedback"
version = "0.1.0"
description = "Production-ready Agentic RAG system featuring three-tier multilevel feedback loops (retrieval grading, generation auditing, and system memory evolution)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "rich>=13.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "pyyaml>=6.0.1",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "streamlit>=1.32.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

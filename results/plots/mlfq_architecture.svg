<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="100%" style="max-width: 100%; height: auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Container Frame -->
  <rect x="2" y="2" width="756" height="516" rx="10" fill="url(#bg-grad)" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Title Bar -->
  <rect x="2" y="2" width="756" height="38" rx="10" fill="#1e3a8a" />
  <rect x="2" y="20" width="756" height="20" fill="#1e3a8a" />
  <text x="380" y="26" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="0.5">FEEDBACKRAG: MULTILEVEL FEEDBACK QUEUE (MLFQ) ARCHITECTURE</text>

  <!-- Input Query -->
  <rect x="280" y="48" width="200" height="28" rx="14" fill="#3b82f6" />
  <text x="380" y="66" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">User Query q</text>
  <line x1="380" y1="76" x2="380" y2="95" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- LEVEL 0 -->
  <rect x="40" y="98" width="340" height="65" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="55" y="118" fill="#1e40af" font-size="11" font-weight="bold">LEVEL 0: Direct Parametric LLM</text>
  <text x="55" y="134" fill="#475569" font-size="9.5">• 3 direct samples at T=0.7 with prompt variation</text>
  <text x="55" y="149" fill="#475569" font-size="9.5">• Computes S1 Self-Consistency mode consensus</text>

  <!-- L0 Gate -->
  <line x1="380" y1="130" x2="430" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <polygon points="475,108 520,130 475,152 430,130" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" />
  <text x="475" y="128" fill="#854d0e" font-size="8.5" font-weight="bold" text-anchor="middle">S1 ≥ τ₀?</text>
  <text x="475" y="139" fill="#854d0e" font-size="7.5" text-anchor="middle">or Policy Stay</text>

  <!-- L0 Pass -> Exit -->
  <line x1="520" y1="130" x2="570" y2="130" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="545" y="123" fill="#16a34a" font-size="8" font-weight="bold" text-anchor="middle">PASS</text>
  <rect x="570" y="110" width="155" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="647" y="126" fill="#14532d" font-size="9" font-weight="bold" text-anchor="middle">Early Exit: Direct Answer</text>
  <text x="647" y="140" fill="#166534" font-size="8" text-anchor="middle">Calls: 3 | Cost: $0.000030</text>

  <!-- L0 Fail -> L1 -->
  <line x1="475" y1="152" x2="475" y2="180" stroke="#dc2626" stroke-width="1.5" />
  <line x1="475" y1="180" x2="210" y2="180" stroke="#dc2626" stroke-width="1.5" />
  <line x1="210" y1="180" x2="210" y2="193" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="340" y="175" fill="#dc2626" font-size="8" font-weight="bold">FAIL (Escalate to Level 1)</text>

  <!-- LEVEL 1 -->
  <rect x="40" y="195" width="340" height="65" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="55" y="215" fill="#166534" font-size="11" font-weight="bold">LEVEL 1: Single-Pass Hybrid RAG</text>
  <text x="55" y="231" fill="#475569" font-size="9.5">• BM25 + Dense RRF Fusion (top-k=5 passages)</text>
  <text x="55" y="246" fill="#475569" font-size="9.5">• Generates grounded response with citations</text>

  <!-- L1 Gate -->
  <line x1="380" y1="227" x2="430" y2="227" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <polygon points="475,205 520,227 475,249 430,227" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" />
  <text x="475" y="224" fill="#854d0e" font-size="8" font-weight="bold" text-anchor="middle">S2 ≥ τ₁ AND</text>
  <text x="475" y="235" fill="#854d0e" font-size="8" font-weight="bold" text-anchor="middle">S3 ≥ τ₁_gnd?</text>

  <!-- L1 Pass -> Exit -->
  <line x1="520" y1="227" x2="570" y2="227" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="545" y="220" fill="#16a34a" font-size="8" font-weight="bold" text-anchor="middle">PASS</text>
  <rect x="570" y="207" width="155" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="647" y="223" fill="#14532d" font-size="9" font-weight="bold" text-anchor="middle">Early Exit: L1 Answer</text>
  <text x="647" y="237" fill="#166534" font-size="8" text-anchor="middle">Calls: ~3 | Cost: $0.000093</text>

  <!-- L1 Fail -> L2 -->
  <line x1="475" y1="249" x2="475" y2="277" stroke="#dc2626" stroke-width="1.5" />
  <line x1="475" y1="277" x2="210" y2="277" stroke="#dc2626" stroke-width="1.5" />
  <line x1="210" y1="277" x2="210" y2="290" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="340" y="272" fill="#dc2626" font-size="8" font-weight="bold">FAIL (Escalate to Level 2)</text>

  <!-- LEVEL 2 -->
  <rect x="40" y="292" width="340" height="65" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" />
  <text x="55" y="312" fill="#92400e" font-size="11" font-weight="bold">LEVEL 2: Iterative Multi-Hop RAG</text>
  <text x="55" y="328" fill="#475569" font-size="9.5">• Query Planner: decomposes into sub-questions</text>
  <text x="55" y="343" fill="#475569" font-size="9.5">• Preserves intermediate bridge entity evidence</text>

  <!-- L2 Gate -->
  <line x1="380" y1="324" x2="430" y2="324" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <polygon points="475,302 520,324 475,346 430,324" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" />
  <text x="475" y="321" fill="#854d0e" font-size="8" font-weight="bold" text-anchor="middle">S3 ≥ τ₂ AND</text>
  <text x="475" y="332" fill="#854d0e" font-size="8" font-weight="bold" text-anchor="middle">S4 ≥ τ₂_comp?</text>

  <!-- L2 Pass -> Exit -->
  <line x1="520" y1="324" x2="570" y2="324" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="545" y="317" fill="#16a34a" font-size="8" font-weight="bold" text-anchor="middle">PASS</text>
  <rect x="570" y="304" width="155" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="647" y="320" fill="#14532d" font-size="9" font-weight="bold" text-anchor="middle">Early Exit: L2 Multi-Hop</text>
  <text x="647" y="334" fill="#166534" font-size="8" text-anchor="middle">Calls: 4 | Cost: $0.000085</text>

  <!-- L2 Fail -> L3 -->
  <line x1="475" y1="346" x2="475" y2="374" stroke="#dc2626" stroke-width="1.5" />
  <line x1="475" y1="374" x2="210" y2="374" stroke="#dc2626" stroke-width="1.5" />
  <line x1="210" y1="374" x2="210" y2="387" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="340" y="369" fill="#dc2626" font-size="8" font-weight="bold">FAIL (Escalate to Level 3)</text>

  <!-- LEVEL 3 -->
  <rect x="40" y="389" width="340" height="65" rx="6" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5" />
  <text x="55" y="409" fill="#5b21b6" font-size="11" font-weight="bold">LEVEL 3: Full Agentic Synthesis</text>
  <text x="55" y="425" fill="#475569" font-size="9.5">• Broadened search (k=10) + 3 parallel drafts</text>
  <text x="55" y="440" fill="#475569" font-size="9.5">• Critic-revision loops with majority consensus</text>

  <!-- L3 Exit -->
  <line x1="380" y1="421" x2="570" y2="421" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)" />
  <text x="475" y="414" fill="#8b5cf6" font-size="8" font-weight="bold" text-anchor="middle">TERMINAL</text>
  <rect x="570" y="401" width="155" height="40" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5" />
  <text x="647" y="417" fill="#4c1d95" font-size="9" font-weight="bold" text-anchor="middle">Terminal: Consensus Answer</text>
  <text x="647" y="431" fill="#5b21b6" font-size="8" text-anchor="middle">Calls: 10.60 | Cost: $0.000458</text>

  <!-- Budget Guard Bottom Bar -->
  <rect x="40" y="468" width="685" height="32" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" />
  <text x="380" y="488" fill="#991b1b" font-size="10" font-weight="bold" text-anchor="middle">Hard Budget Guard: If cumulative calls ≥ 15, immediately terminate and return best candidate (status: budget_exhausted)</text>
</svg>